name: Non-confidential bug report
description: Report a reproducible bug without posting secrets or customer data.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This form is public. Never paste the original sensitive input, credentials, customer logs, private URLs, vulnerability details, or other confidential material. Use synthetic examples only.
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - MaskedForm
        - Encoding Repair API
        - Universal Token Counter
        - CSV Escape & Sanitize API
        - API Adjustmenter
        - APIron Lab website
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Use synthetic or fully anonymized examples only.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, or API client version. Do not include account identifiers.
  - type: checkboxes
    id: safety
    attributes:
      label: Public-information confirmation
      options:
        - label: I confirm that this report contains no personal, credential, customer, security-sensitive, or confidential information.
          required: true
